services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spendwise}
      POSTGRES_USER: ${POSTGRES_USER:-spendwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - spendwise_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spendwise} -d ${POSTGRES_DB:-spendwise}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-postgres://spendwise:local_only_change_me@db:5432/spendwise}
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me}
      SPRING_ANALYTICS_URL: ${SPRING_ANALYTICS_URL:-http://analytics:8080}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      analytics:
        condition: service_started

  analytics:
    build: ./spring-analytics
    ports:
      - "8081:8080"

  web:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  spendwise_db:
