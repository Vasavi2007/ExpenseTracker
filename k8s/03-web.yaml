apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendwise-web
  namespace: spendwise
spec:
  replicas: 2
  selector:
    matchLabels: { app: spendwise-web }
  template:
    metadata:
      labels: { app: spendwise-web }
    spec:
      containers:
        - name: web
          image: spendwise-web:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: spendwise-web
  namespace: spendwise
spec:
  type: NodePort
  selector: { app: spendwise-web }
  ports: [{ port: 80, targetPort: 80, nodePort: 30173 }]
