apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendwise-api
  namespace: spendwise
spec:
  replicas: 2
  selector:
    matchLabels: { app: spendwise-api }
  template:
    metadata:
      labels: { app: spendwise-api }
    spec:
      containers:
        - name: api
          image: spendwise-api:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5000 }]
          env:
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: spendwise-secrets, key: database-url } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: spendwise-secrets, key: jwt-secret } }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: spendwise-api
  namespace: spendwise
spec:
  selector: { app: spendwise-api }
  ports: [{ port: 5000, targetPort: 5000 }]
