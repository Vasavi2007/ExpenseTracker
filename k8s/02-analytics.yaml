apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendwise-analytics
  namespace: spendwise
spec:
  replicas: 1
  selector:
    matchLabels: { app: spendwise-analytics }
  template:
    metadata:
      labels: { app: spendwise-analytics }
    spec:
      containers:
        - name: analytics
          image: spendwise-analytics:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: spendwise-analytics
  namespace: spendwise
spec:
  selector: { app: spendwise-analytics }
  ports: [{ port: 8080, targetPort: 8080 }]
